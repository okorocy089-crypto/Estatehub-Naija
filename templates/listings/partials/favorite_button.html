{% if user.is_authenticated %}
<form method="post" action="{% url 'listings:toggle_favorite' slug=property.slug %}" class="favorite-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="favorite-button{% if property.id in favorite_property_ids or is_favorite %} is-saved{% endif %}" type="submit" aria-pressed="{% if property.id in favorite_property_ids or is_favorite %}true{% else %}false{% endif %}" aria-label="{% if property.id in favorite_property_ids or is_favorite %}Remove {{ property.title }} from saved properties{% else %}Save {{ property.title }}{% endif %}" data-save-label="Save {{ property.title }}" data-saved-label="Remove {{ property.title }} from saved properties">
        <span class="favorite-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bookmark" viewBox="0 0 16 16" data-bookmark-outline {% if property.id in favorite_property_ids or is_favorite %}hidden{% endif %} focusable="false">
                <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/>
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bookmark-fill" viewBox="0 0 16 16" data-bookmark-filled {% if property.id in favorite_property_ids or is_favorite %}{% else %}hidden{% endif %} focusable="false">
                <path d="M2 2v13.5a.5.5 0 0 0 .74.439L8 13.069l5.26 2.87A.5.5 0 0 0 14 15.5V2a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2"/>
            </svg>
        </span>
        <span class="favorite-label" data-favorite-label {% if property.id in favorite_property_ids or is_favorite %}{% else %}hidden{% endif %}>Saved</span>
    </button>
    <span class="favorite-error" data-favorite-error role="alert" hidden></span>
</form>
{% else %}
<a class="favorite-button" href="{% url 'listings:auth_login' %}?next={{ request.get_full_path|urlencode }}" aria-label="Log in to save {{ property.title }}">
    <span class="favorite-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bookmark" viewBox="0 0 16 16" focusable="false">
            <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/>
        </svg>
    </span>
</a>
{% endif %}
